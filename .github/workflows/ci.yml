name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          echo 'somecredstorepass' | gnome-keyring-daemon --unlock
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4
      - name: Core Tests
        env:
          GO_TEST_PARALLEL: "16"
        run: mise run test:ci:core

  test-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          echo 'somecredstorepass' | gnome-keyring-daemon --unlock
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4
      - name: Integration Tests
        env:
          GO_TEST_PARALLEL: "16"
        run: mise run test:ci:integration:shard -- ${{ matrix.shard }}

  test-canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Run the (no-cost, no-API) Vogon canary against each checkpoint backend so
      # the git-refs store is guarded on every PR alongside the default git-branch.
      matrix:
        checkpoint_store: [git-branch, git-refs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          echo 'somecredstorepass' | gnome-keyring-daemon --unlock
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4
      - name: E2E Canary
        env:
          E2E_CHECKPOINT_STORE: ${{ matrix.checkpoint_store }}
        run: mise run test:e2e:canary

  test-windows-external-discovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Runs only the Windows-gated discovery tests: exec.LookPath resolves
      # external agents via PATHEXT (.bat/.cmd), a code path the ubuntu jobs
      # cannot exercise. The rest of the package mocks agents as #!/bin/sh
      # scripts, which Windows cannot execute, so it stays on ubuntu.
      - name: Windows external-agent discovery
        run: go test ./cmd/entire/cli/agent/external -run 'RegistersBatOnWindows$' -count=1

  test:
    runs-on: ubuntu-latest
    needs:
      - test-core
      - test-integration
      - test-canary
      - test-windows-external-discovery
    if: ${{ always() }}
    steps:
      - name: Check dependencies
        run: |
          [ "${{ needs.test-core.result }}" = "success" ]
          [ "${{ needs.test-integration.result }}" = "success" ]
          [ "${{ needs.test-canary.result }}" = "success" ]
          [ "${{ needs.test-windows-external-discovery.result }}" = "success" ]
